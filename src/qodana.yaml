#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#
#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"
#Specify IDE code to run analysis without container (Applied in CI/CD pipeline)
ide: QDNET
#Specify inspection profile for code analysis
profile:
  name: qodana.starter
include:
  - name: ConvertIfStatementToReturnStatement
  - name: ArrangeThisQualifier
  - name: CanReplaceCastWithVariableType
  - name: ChangeFieldTypeToSystemThreadingLock
  - name: ConvertIfStatementToSwitchStatement
  - name: ConvertToPrimaryConstructor
  - name: ConvertToExtensionBlock
  - name: ConvertToConstant.Local
  - name: UseNegatedPatternInIsExpression
  - name: ConvertToAutoPropertyWithPrivateSetter
  - name: InvokeAsExtensionMember
  - name: DuplicatedSwitchSectionBodies
  - name: DuplicatedChainedIfBodies
  - name: DuplicatedSequentialIfBodies
  - name: EditorConfigHeaderUniqueness
  - name: ExtractCommonBranchingCode
  - name: FieldCanBeMadeReadOnly.Local
  - name: InvertIf
  - name: LoopCanBeConvertedToQuery
  - name: MemberCanBeMadeStatic.Local
  - name: HtmlDeprecatedAttribute
  - name: ForeachCanBePartlyConvertedToQueryUsingAnotherGetEnumerator
  - name: Xaml.PossibleNullReferenceException
  - name: PreferConcreteValueOverDefault
  - name: MoveLocalFunctionAfterJumpStatement
  - name: RedundantEmptyObjectCreationArgumentList
  - name: RedundantLambdaSignatureParentheses
  - name: RedundantStringInterpolation
  - name: RedundantTypeDeclarationBody
  - name: RedundantVerbatimStringPrefix
  - name: ArrangeRedundantParentheses
  - name: UseNullPropagation
  - name: ReplaceWithFieldKeyword
  - name: CA1860
  - name: CA1834
  - name: SYSLIB1045
  - name: CA2208
  - name: CA1822
  - name: CA1835
  - name: CA1510
  - name: CA1512
  - name: CA1866
  - name: CA1859
  - name: CA1507
  - name: SwitchExpressionHandlesSomeKnownEnumValuesWithExceptionInDefault
  - name: Xaml.BindingWithoutContextNotResolved
  - name: UseNameofExpression
  - name: UseCollectionExpression
  - name: UseObjectOrCollectionInitializer
  - name: ArrangeTrailingCommaInMultilineLists
  - name: ArrangeObjectCreationWhenTypeNotEvident

#Enable inspections
#include:
#  - name: <SomeEnabledInspectionId>
#Disable inspections
#exclude:
#  - name: <SomeDisabledInspectionId>
#    paths:
#      - <path/where/not/run/inspection>
#Execute shell command before Qodana execution (Applied in CI/CD pipeline)
#bootstrap: sh ./prepare-qodana.sh
#Install IDE plugins before Qodana execution (Applied in CI/CD pipeline)
#plugins:
#  - id: <plugin.id> #(plugin id can be found at https://plugins.jetbrains.com)
# Quality gate. Will fail the CI/CD pipeline if any condition is not met
# severityThresholds - configures maximum thresholds for different problem severities
# testCoverageThresholds - configures minimum code coverage on a whole project and newly added code
# Code Coverage is available in Ultimate and Ultimate Plus plans
#failureConditions:
#  severityThresholds:
#    any: 15
#    critical: 5
#  testCoverageThresholds:
#    fresh: 70
#    total: 50
